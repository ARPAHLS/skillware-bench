[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skillware-bench"
version = "0.1.0"
description = "The transparent, empirical benchmark suite and evaluation harness for Skillware skills, agent constitutions, and frontier models."
readme = "README.md"
authors = [
  { name = "Ross Peili", email = "vpeilivanidis@gmail.com" },
  { name = "ARPA Hellenic Logical Systems", email = "skillware-os@arpacorp.net" },
]
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "python-dotenv>=1.0.0",
    "requests>=2.28.0",
    "tabulate>=0.9.0",
    "skillware>=0.5.5",
    "aura-harness>=0.3.5",
    "mnemolink>=0.2.3",
]
requires-python = ">=3.10"

keywords = [
    "ai",
    "ai-agents",
    "benchmark",
    "agent-evaluation",
    "skillware",
    "function-calling",
    "llm-evaluation",
    "tool-use",
    "agent-constitution",
    "governance",
    "frontier-models",
    "harness",
    "open-source",
]

[project.urls]
Homepage = "https://github.com/arpahls/skillware-bench"
Repository = "https://github.com/arpahls/skillware-bench"
Documentation = "https://github.com/arpahls/skillware-bench/blob/main/README.md"
Issues = "https://github.com/arpahls/skillware-bench/issues"
Changelog = "https://github.com/arpahls/skillware-bench/blob/main/CHANGELOG.md"

[project.scripts]
skillware-bench = "skillware_bench.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.10",
    "pytest-asyncio>=0.21",
    "ruff>=0.1.0",
    "black>=23.0",
    "mypy>=1.4",
    "tomli>=1.1.0;python_version<'3.11'",
]
openai = [
    "openai>=1.0.0",
]
anthropic = [
    "anthropic>=0.30.0",
]
gemini = [
    "google-genai>=0.1.0",
]
mistral = [
    "mistralai>=1.0.0",
]
viz = [
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
]
all = [
    "skillware-bench[dev,openai,anthropic,gemini,mistral,viz]",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["skillware_bench*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["skillware", "aura", "mnemolink", "scratch"]

[tool.black]
line-length = 100
target-version = ["py310"]
extend-exclude = '''
/(
  skillware
| aura
| mnemolink
| scratch
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
