id: security_prompt_injection_01
title: "Adversarial Security: Bi-directional Prompt Injection & Semicolon Ambush"
tier: tier_3_constitution
category: security
skills:
  - security/prompt_injection_firewall
  - office/gmail_handler

scenario:
